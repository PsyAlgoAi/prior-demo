<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ---- tokens -------------------------------------------------------- */
  :root{
    --paper:#FAFAF9; --surface:#FFFFFF; --sunken:#F4F4F2;
    --line:#E7E5E4; --line-strong:#D2CECB;
    --ink:#18181B; --muted:#57534E; --faint:#8A8580;
    --ember:#C2410C; --ember-bg:#FDF0E8;
    --adopted:#0F766E; --adopted-bg:#E3F5F2;
    --rejected:#9F1239; --rejected-bg:#FCE9EE;
    --temporary:#A16207; --temporary-bg:#FBF3DC;
    --stale:#6B6764; --stale-bg:#EFEDEB;
    --ui:"Inter",system-ui,-apple-system,sans-serif;
    --brand:"Instrument Serif",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F0F11; --surface:#18181B; --sunken:#121214;
      --line:#27272A; --line-strong:#3F3F46;
      --ink:#FAFAF9; --muted:#A1A1AA; --faint:#71717A;
      --ember:#FB7C3C; --ember-bg:#2A1810;
      --adopted:#5EEAD4; --adopted-bg:#0C2824;
      --rejected:#FB7185; --rejected-bg:#2C1018;
      --temporary:#FCD34D; --temporary-bg:#2A2110;
      --stale:#8E8A86; --stale-bg:#1E1E21;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F0F11; --surface:#18181B; --sunken:#121214;
    --line:#27272A; --line-strong:#3F3F46;
    --ink:#FAFAF9; --muted:#A1A1AA; --faint:#71717A;
    --ember:#FB7C3C; --ember-bg:#2A1810;
    --adopted:#5EEAD4; --adopted-bg:#0C2824;
    --rejected:#FB7185; --rejected-bg:#2C1018;
    --temporary:#FCD34D; --temporary-bg:#2A2110;
    --stale:#8E8A86; --stale-bg:#1E1E21;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  a{color:var(--ember);text-decoration:none}
  :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}

  /* ---- shell --------------------------------------------------------- */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);padding:20px 14px;background:var(--surface)}
  .main{padding:28px 32px 72px;max-width:1100px}

  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
  .brand svg{width:30px;height:31px;flex:none}
  .brand .n{font-family:var(--brand);font-size:26px;line-height:1}
  .repo{font-family:var(--mono);font-size:11.5px;color:var(--faint);
        padding:0 8px 16px;word-break:break-all}

  nav{display:flex;flex-direction:column;gap:2px}
  nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;
    width:100%;text-align:left;padding:7px 10px;border-radius:7px;color:var(--muted);
    font-weight:500}
  nav button:hover{background:var(--sunken);color:var(--ink)}
  nav button[aria-current="true"]{background:var(--ember-bg);color:var(--ember);font-weight:600}
  nav .count{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--faint)}
  nav button[aria-current="true"] .count{color:var(--ember)}

  .sim{margin:18px 8px 0;font-size:11px;line-height:1.5;color:var(--faint);
       border-top:1px solid var(--line);padding-top:12px}

  h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
     color:var(--faint);margin:26px 0 10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
        padding:18px 20px}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.35fr 1fr}

  .score{display:flex;align-items:flex-end;gap:16px}
  .score .v{font-family:var(--brand);font-size:52px;line-height:.85}
  .score .o{font-size:16px;color:var(--faint);padding-bottom:5px}
  .spark{margin-top:12px}
  .stat .k{font-size:11.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
  .stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .h{font-size:12px;color:var(--muted);margin-top:2px}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
        letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
        white-space:nowrap}
  .pill.adopted{background:var(--adopted-bg);color:var(--adopted)}
  .pill.rejected{background:var(--rejected-bg);color:var(--rejected)}
  .pill.temporary{background:var(--temporary-bg);color:var(--temporary)}
  .pill.superseded{background:var(--stale-bg);color:var(--stale)}
  .pill.agent{background:var(--ember-bg);color:var(--ember)}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{font-size:12.5px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted)}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);
    border-color:var(--ink)}

  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
       background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
       padding:13px 16px;width:100%;text-align:left}
  .row:hover{border-color:var(--line-strong)}
  .row[aria-expanded="true"]{border-color:var(--ember)}
  .row .t{font-weight:600;font-size:14.5px;letter-spacing:-.005em}
  .row .m{font-size:12px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
  .row .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

  .detail{border:1px solid var(--ember);border-top:none;border-radius:0 0 var(--r) var(--r);
          background:var(--surface);padding:0 18px 18px;margin-top:-9px}
  .detail h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
             color:var(--faint);margin:16px 0 6px}
  .because{font-size:14px;line-height:1.6}
  .alt{display:flex;gap:9px;align-items:baseline;font-size:13.5px;margin-bottom:5px}
  .alt .x{color:var(--rejected);font-weight:600;flex:none}
  .alt .w{color:var(--muted)}
  .quote{border-left:2px solid var(--line-strong);padding:2px 0 2px 13px;
         font-size:13.5px;color:var(--muted);font-style:italic}
  .src{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:7px}
  .govern{font-family:var(--mono);font-size:12.5px;background:var(--sunken);
          border:1px solid var(--line);border-radius:6px;padding:5px 9px;display:inline-block;
          margin:0 5px 5px 0}
  .revisit{background:var(--temporary-bg);color:var(--temporary);border-radius:7px;
           padding:9px 12px;font-size:13px;font-weight:500}
  .supers{background:var(--stale-bg);border-radius:7px;padding:9px 12px;font-size:13px;
          color:var(--muted)}

  .bar{height:7px;background:var(--sunken);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--adopted);border-radius:999px}
  .bar.risk i{background:var(--rejected)}
  .covrow{display:grid;grid-template-columns:110px 1fr 76px;gap:12px;align-items:center;
          padding:9px 0;border-bottom:1px solid var(--line)}
  .covrow:last-child{border-bottom:none}
  .covrow .a{font-family:var(--mono);font-size:13px}
  .covrow .n{font-size:12.5px;color:var(--muted);text-align:right;
             font-variant-numeric:tabular-nums}

  .alert{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
         padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);
         background:var(--surface);margin-bottom:8px}
  .alert .ic{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;
             font-size:13px;font-weight:700;flex:none}
  .alert.revisit .ic{background:var(--temporary-bg);color:var(--temporary)}
  .alert.stale .ic{background:var(--stale-bg);color:var(--stale)}
  .alert.gap .ic{background:var(--rejected-bg);color:var(--rejected)}
  .alert .tx{font-size:13.5px;line-height:1.5}
  .alert .rf{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px}

  .person{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;
          border-bottom:1px solid var(--line);align-items:center}
  .person:last-child{border-bottom:none}
  .person .nm{font-weight:600}
  .person .ar{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
  .note{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.55}




  .repohdr{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 22px;margin-bottom:16px}
  .repohdr .sc{font-family:var(--brand);font-size:46px;line-height:.85}
  .repohdr .of{font-size:15px;color:var(--faint);padding-bottom:4px}
  .repohdr .lb{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-bottom:6px}
  .repohdr .nums{font-size:13.5px;color:var(--muted);line-height:1.6}
  .repohdr .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
  .empty{background:var(--surface);border:1px solid var(--ember);border-radius:var(--r);
    padding:20px 24px;max-width:72ch}
  .empty h3{font-size:16px;font-weight:600;margin-bottom:8px}
  .empty p{font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:10px}
  .empty p:last-child{margin-bottom:0}
  .empty b{color:var(--ink)}

  /* ---- try it --------------------------------------------------------- */
  .tryform{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tryform input{flex:1;min-width:280px;font-family:var(--mono);font-size:13.5px;
    padding:11px 14px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface);color:var(--ink)}
  .tryform input::placeholder{color:var(--faint)}
  .tryform button{padding:11px 22px;border-radius:9px;background:var(--ink);
    color:var(--paper);font-weight:600;font-size:13.5px}
  .tryform button:disabled{opacity:.45;cursor:default}
  .egs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .egs .lb{font-size:12.5px;color:var(--faint)}
  .egs button{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted)}
  .egs button:hover{border-color:var(--line-strong);color:var(--ink)}
  details.tok{margin-bottom:16px}
  details.tok summary{font-size:12.5px;color:var(--faint);cursor:pointer}
  details.tok input{width:100%;max-width:440px;margin-top:8px;font-family:var(--mono);
    font-size:12.5px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;
    background:var(--surface);color:var(--ink)}
  details.tok p{font-size:12px;color:var(--faint);margin-top:6px;max-width:560px;
    line-height:1.5}
  .runlog{background:#121214;border:1px solid #27272A;border-radius:var(--r);
    padding:15px 18px;font-family:var(--mono);font-size:12.6px;line-height:1.8;
    color:#D4D4D8;margin-bottom:16px;overflow-x:auto}
  .runlog .st{color:#71717A;display:inline-block;min-width:92px}
  .runlog .ok{color:#5EEAD4} .runlog .warn{color:#FCD34D} .runlog .err{color:#FB7185}
  .runlog .run{color:#FB7C3C}
  .banner{background:var(--rejected-bg);color:var(--rejected);border-radius:var(--r);
    padding:13px 16px;font-size:13.5px;line-height:1.5;margin-bottom:16px}
  .realnote{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;font-size:12.8px;color:var(--muted);line-height:1.55;margin-top:18px}
  .realnote b{color:var(--ink)}

  /* ---- walkthrough ---------------------------------------------------- */
  .steps{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
  .steps button{width:30px;height:30px;border-radius:999px;border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
  .steps button[aria-current="true"]{background:var(--ember);border-color:var(--ember);
    color:#fff}
  .steps button.done{color:var(--ink);border-color:var(--line-strong)}
  .say{font-size:16px;line-height:1.5;color:var(--muted);max-width:66ch;margin-bottom:18px}
  .after{margin-top:18px;padding:14px 18px;background:var(--ember-bg);
    border-radius:var(--r);font-size:14px;line-height:1.55;max-width:74ch}
  .navbtns{display:flex;gap:10px;margin-top:24px;align-items:center}
  .navbtns button{padding:9px 18px;border-radius:999px;border:1px solid var(--line-strong);
    font-weight:600;font-size:13.5px}
  .navbtns button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .of{font-size:12.5px;color:var(--faint);margin-left:auto;
    font-variant-numeric:tabular-nums}

  /* ---- terminal ------------------------------------------------------- */
  .term{background:#121214;border:1px solid #27272A;border-radius:var(--r);
    padding:18px 20px;font-family:var(--mono);font-size:12.8px;line-height:1.75;
    overflow-x:auto;color:#D4D4D8}
  .term .p{color:#71717A}
  .term .c{color:#FAFAFA;font-weight:500}
  .term .g{color:#5EEAD4}
  .term .r{color:#FB7185}
  .term .e{color:#FB7C3C}
  .term .d{color:#A1A1AA}
  .term .badge{display:inline-block;background:#0C2824;color:#5EEAD4;font-size:10px;
    font-weight:700;letter-spacing:.08em;padding:1px 7px;border-radius:999px}

  /* ---- code block ----------------------------------------------------- */
  .codeblk{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 20px;font-family:var(--mono);font-size:12.8px;line-height:1.75;
    overflow-x:auto;white-space:pre}
  .codeblk em{color:var(--ember);font-style:normal;font-weight:600}
  .codeblk .cm{color:var(--faint)}

  /* ---- agent exchange ------------------------------------------------- */
  .xchg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .xchg .pane{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden}
  .xchg .hd{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);padding:10px 16px;border-bottom:1px solid var(--line);
    background:var(--sunken)}
  .xchg pre{font-family:var(--mono);font-size:12.2px;line-height:1.7;padding:14px 16px;
    overflow-x:auto;color:var(--ink)}
  .xchg .k{color:var(--ember)}
  .chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;margin-bottom:12px}
  .chat .who{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);margin-bottom:5px}
  .chat .msg{font-size:14.5px}

  /* ---- pr comment ----------------------------------------------------- */
  .prc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;max-width:760px}
  .prc .hd{display:flex;align-items:center;gap:9px;padding:11px 16px;
    border-bottom:1px solid var(--line);background:var(--sunken);font-size:13px}
  .prc .av{width:22px;height:22px;border-radius:999px;background:var(--ember-bg);
    color:var(--ember);display:grid;place-items:center;font-size:11px;font-weight:700}
  .prc .who{font-weight:600}
  .prc .when{color:var(--faint);font-size:12px}
  .prc .bd{padding:16px 18px}
  .prc .warn{display:flex;gap:9px;align-items:baseline;font-weight:600;font-size:14.5px;
    color:var(--rejected);margin-bottom:12px}
  .prc .hit{border-left:2px solid var(--rejected);padding:3px 0 3px 13px;margin-bottom:12px}
  .prc .hit .ln{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .prc .hit .tx{font-size:13.5px;margin-top:3px}
  .prc .hit .lk{font-family:var(--mono);font-size:12px;color:var(--ember)}
  .prc .ask{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);
    padding-top:12px}

  /* ---- loop ----------------------------------------------------------- */
  .loop{display:flex;flex-direction:column;gap:0;max-width:620px}
  .loop .n{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start}
  .loop .dot{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:var(--sunken);color:var(--muted);
    border:1px solid var(--line)}
  .loop .n.hi .dot{background:var(--ember);color:#fff;border-color:var(--ember)}
  .loop .tx{padding-bottom:16px}
  .loop .tx b{display:block;font-size:14.5px;margin-bottom:2px}
  .loop .tx span{font-size:13.5px;color:var(--muted)}
  .loop .bar{width:1px;height:100%;background:var(--line);margin:0 auto;grid-column:1}

  @media (max-width:820px){ .xchg{grid-template-columns:1fr} }

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{border-right:none;border-bottom:1px solid var(--line);padding:14px 16px}
    nav{flex-direction:row;overflow-x:auto;gap:4px}
    nav button{white-space:nowrap}
    .sim{display:none}
    .main{padding:20px 16px 56px}
    .g3,.g2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 100 104" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 6c15.5 0 26 13 26 31 0 22-11.5 45-26 45S24 59 24 37C24 19 34.5 6 50 6z"/>
          <path d="M35.5 44.5c2-4 9.5-4.5 12-1-2.5 3.5-10 4-12 1z"/>
          <path d="M64.5 44.5c-2-4-9.5-4.5-12-1 2.5 3.5 10 4 12 1z"/>
          <path d="M37.5 47.5c.8 3 1.8 4.8 3.2 6"/><path d="M62.5 47.5c-.8 3-1.8 4.8-3.2 6"/>
          <path d="M47.8 55.5l-1.2 4.4"/><path d="M52.2 55.5l1.2 4.4"/>
          <ellipse cx="50" cy="68" rx="4.1" ry="7.6"/>
          <path d="M27 30.5c-8.5 1.5-12 10-11 23.5C17 70 19 87 20.5 97"/>
          <path d="M33 43c-5 9.5-6.5 22.5-5.5 35.5.5 7.5 1.5 14 2.5 19"/>
          <path d="M73 30.5c8.5 1.5 12 10 11 23.5C83 70 81 87 79.5 97"/>
          <path d="M67 43c5 9.5 6.5 22.5 5.5 35.5-.5 7.5-1.5 14-2.5 19"/>
        </g>
        <g class="mk" stroke-width="1.6" stroke-linecap="round">
          <path d="M50 20.5L43.5 27M50 20.5L56.5 27M43.5 27L50 33.5M56.5 27L50 33.5"/>
        </g>
        <g class="mkf"><circle cx="50" cy="20.5" r="2.2"/><circle cx="43.5" cy="27" r="2.2"/>
          <circle cx="56.5" cy="27" r="2.2"/><circle cx="50" cy="33.5" r="2.2"/></g>
      </svg>
      <span class="n">Prior</span>
    </div>
    <div class="repo" id="repo"></div>
    <nav id="nav"></nav>
    <p class="sim">Demo data. The repository is the simulated world from
      <strong>Simple-Test</strong>, written so every feature has something to show.
      Nothing here is presented as a real project.</p>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="data.js"></script>
<script src="walkthrough.js"></script>
<script src="live.js"></script>
<script>
(function(){
  const D = window.PRIOR;
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');
  document.getElementById('repo').textContent = D.repo;

  // the mark's inner graph uses the brand accent; everything else inherits.
  const st = document.createElement('style');
  st.textContent = '.brand svg .mk{stroke:var(--ember)} .brand svg .mkf{fill:var(--ember)}';
  document.head.appendChild(st);

  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const VIEWS = [
    { id:'tour',      label:'How it works' },
    { id:'try',       label:'Try it live' },
    { id:'overview',  label:'Overview'  },
    { id:'decisions', label:'Decisions', count:D.decisions.length },
    { id:'coverage',  label:'Coverage'  },
    { id:'people',    label:'People'    },
    { id:'alerts',    label:'Alerts',    count:D.alerts.length }
  ];

  let view = 'tour', filter = 'all', open = null, step = 0;

  nav.innerHTML = VIEWS.map(v =>
    `<button data-v="${v.id}">${v.label}${v.count!=null?`<span class="count">${v.count}</span>`:''}</button>`
  ).join('');
  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    view = b.dataset.v; open = null; render();
  });

  function sparkline(vals){
    const w=210,h=38,p=3, mx=Math.max(...vals), mn=Math.min(...vals);
    const pts = vals.map((v,i)=>{
      const x = p + i*(w-2*p)/(vals.length-1);
      const y = h-p - (v-mn)/((mx-mn)||1)*(h-2*p);
      return [x.toFixed(1), y.toFixed(1)];
    });
    const line = pts.map(p=>p.join(',')).join(' ');
    const last = pts[pts.length-1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
      <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="currentColor"/></svg>`;
  }

  function statusPill(d){
    const map = { adopted:'Adopted', rejected:'Rejected',
                  temporary:'Temporary', superseded:'Superseded' };
    return `<span class="pill ${d.status}">${map[d.status]}</span>`;
  }

  function detail(d){
    const sup = d.supersededBy
      ? `<div class="supers">Replaced by <strong>${esc(d.supersededBy)}</strong>.
         Kept because the reasoning still explains the code that was written under it.</div>` : '';
    const repl = d.supersedes
      ? `<div class="supers">Replaces <strong>${esc(d.supersedes)}</strong>.</div>` : '';
    const alts = d.rejected && d.rejected.length
      ? `<h3>Ruled out</h3>` + d.rejected.map(a =>
          `<div class="alt"><span class="x">&times;</span>
             <span><strong>${esc(a.option)}</strong>
             <span class="w"> &nbsp;${esc(a.why)}</span></span></div>`).join('')
      : '';
    const rev = d.revisit
      ? `<h3>Reopen when</h3><div class="revisit">${esc(d.revisit)}</div>` : '';
    const src = d.pr ? `pull request #${d.pr}` : `issue #${d.issue}`;
    return `<div class="detail">
      ${sup}${repl}
      <h3>Why</h3><p class="because">${esc(d.because)}</p>
      ${alts}${rev}
      <h3>Governs</h3>${d.governs.map(g=>`<span class="govern">${esc(g)}</span>`).join('')}
      <h3>Evidence</h3>
      <p class="quote">&ldquo;${esc(d.quote)}&rdquo;</p>
      <p class="src">${esc(d.author)} &middot; ${esc(src)} &middot; ${esc(d.date)}${
        d.decidedBy==='agent' ? ' &middot; proposed by an assistant, accepted by a human' : ''}</p>
    </div>`;
  }

  function decisionList(items){
    return `<div class="list">` + items.map(d => {
      const isOpen = open === d.id;
      return `<button class="row" data-id="${d.id}" aria-expanded="${isOpen}">
          <span>
            <span class="t">${esc(d.title)}</span>
            <span class="m">${esc(d.id)} &middot; ${esc(d.area)} &middot; ${esc(d.governs[0])}</span>
          </span>
          <span class="tags">
            ${d.decidedBy==='agent'?'<span class="pill agent">AI proposed</span>':''}
            ${d.rejected&&d.rejected.length?`<span class="pill rejected">${d.rejected.length} ruled out</span>`:''}
            ${statusPill(d)}
          </span>
        </button>` + (isOpen ? detail(d) : '');
    }).join('') + `</div>`;
  }


  // ---- walkthrough surfaces ------------------------------------------
  const T = window.PRIOR_TOUR;
  const byId = id => D.decisions.find(d => d.id === id);

  function termBlock(lines){
    return `<div class="term">` + lines.map(l => {
      if(l.p != null) return `<div><span class="p">${esc(l.p)}</span><span class="c">${esc(l.c)}</span></div>`;
      if(l.g != null) return `<div class="g">${esc(l.g)}</div>`;
      if(l.r != null) return `<div class="r">${esc(l.r)}</div>`;
      if(l.e != null) return `<div class="e">${esc(l.e)}</div>`;
      if(l.s != null) return `<div><span class="badge">${esc(l.s)}</span></div>`;
      return `<div class="${l.d?'d':''}">${esc(l.o)||'&nbsp;'}</div>`;
    }).join('') + `</div>`;
  }

  function codeBlock(src){
    return `<div class="codeblk">` + esc(src)
      .replace(/(#[^\n]*)/g, '<span class="cm">$1</span>')
      .replace(/range\(3\)/, 'range(<em>3</em>)') + `</div>`;
  }

  function agentSurface(){
    return `
      <div class="chat">
        <div class="who">Developer, in Cursor</div>
        <div class="msg">Add caching to the delivery client, and make it more reliable
        under load.</div>
      </div>
      <div class="xchg">
        <div class="pane"><div class="hd">Cursor asks Prior, on its own</div>
<pre>{ <span class="k">"tool"</span>: "get_constraints",
  <span class="k">"file"</span>: "src/delivery.py",
  <span class="k">"lines"</span>: [38, 52] }</pre></div>
        <div class="pane"><div class="hd">Prior answers in 40ms</div>
<pre>{ <span class="k">"fixed"</span>: [
    { "rule": "attempts = 3",
      "source": "PR #847" } ],
  <span class="k">"rejected"</span>: [
    { "option": "circuit breaker",
      "why": "another piece of state",
      "revisit_if": "&gt; 10k rps" },
    { "option": "Redis cache",
      "why": "removed in 2023" } ] }</pre></div>
      </div>
      <div class="chat" style="margin-top:12px;border-color:var(--ember)">
        <div class="who" style="color:var(--ember)">What Cursor then writes back</div>
        <div class="msg">Added an in-process cache with a five minute TTL. I left the
        attempt cap at 3: PR&nbsp;#847 tried 5 and measured it worse. I did not add a
        circuit breaker, which was declined in the same review and is meant to be
        reconsidered above 10k&nbsp;rps.</div>
      </div>`;
  }

  function prSurface(){
    return `
      <div class="prc">
        <div class="hd"><span class="av" aria-hidden="true">P</span>
          <span class="who">prior</span>
          <span class="when">commented on #913 &middot; 2 minutes ago</span></div>
        <div class="bd">
          <div class="warn"><span aria-hidden="true">&#9888;</span>
            This pull request contradicts two recorded decisions</div>
          <div class="hit">
            <div class="ln">src/delivery.py:38 &nbsp;&nbsp;attempts 3 &rarr; 5</div>
            <div class="tx">PR&nbsp;#847 tried 5 and reverted it. Five made the pile-up
              worse and recovery took twice as long.</div>
            <div class="lk">&rarr; #847 (discussion_r1234)</div>
          </div>
          <div class="hit">
            <div class="ln">src/delivery.py:88 &nbsp;&nbsp;adds a circuit breaker</div>
            <div class="tx">Declined in #847 as another piece of state. The condition for
              reconsidering it was 10k&nbsp;rps. Current traffic is 11.2k, so this may
              now be right.</div>
            <div class="lk">&rarr; #847</div>
          </div>
          <div class="ask">Not necessarily wrong. If either change is deliberate, say why
            and I will record it as a new decision.</div>
        </div>
      </div>`;
  }

  function loopSurface(){
    const N = [
      ["1","A pull request merges","Nothing is asked of anyone."],
      ["2","A GitHub Action runs","On GitHub's servers, in seconds. Not on your machine."],
      ["3","It reads that one discussion","Not the whole history again."],
      ["4","It opens a pull request","&ldquo;I extracted this decision. Correct?&rdquo; The tool never commits on its own."],
      ["5","A person clicks merge","Two seconds, and that click is the strongest evidence in the graph."],
      ["6","The rules files update","Everyone's assistant learns it on their next git pull."]
    ];
    return `<div class="loop">` + N.map(([n,t,d],i)=>
      `<div class="n ${i===4?'hi':''}"><span class="dot">${n}</span>
         <span class="tx"><b>${t}</b><span>${d}</span></span></div>`).join('') + `</div>`;
  }

  function tour(){
    const t = T[step];
    let body = '';
    if(t.kind === 'problem')  body = codeBlock(t.code);
    if(t.kind === 'term')     body = termBlock(t.term);
    if(t.kind === 'decision'){ const d = byId(t.did);
      body = `<div class="list"><div class="row" style="cursor:default" aria-expanded="true">
        <span><span class="t">${esc(d.title)}</span>
        <span class="m">${esc(d.id)} &middot; ${esc(d.area)} &middot; ${esc(d.governs[0])}</span></span>
        <span class="tags"><span class="pill rejected">${d.rejected.length} ruled out</span>
        ${statusPill(d)}</span></div>${detail(d)}</div>`; }
    if(t.kind === 'agent')    body = agentSurface();
    if(t.kind === 'pr')       body = prSurface();
    if(t.kind === 'loop')     body = loopSurface();

    return `
      <h1>${esc(t.title)}</h1>
      <p class="say">${esc(t.say)}</p>
      <div class="steps">${T.map((x,i)=>
        `<button data-s="${i}" aria-current="${i===step}" class="${i<step?'done':''}"
          aria-label="Step ${x.n}">${x.n}</button>`).join('')}</div>
      ${body}
      <div class="after">${t.after}</div>
      <div class="navbtns">
        <button data-step="prev" ${step===0?'disabled':''}>&larr; Back</button>
        <button data-step="next" class="primary" ${step===T.length-1?'disabled':''}>Next &rarr;</button>
        <span class="of">${step+1} of ${T.length}</span>
      </div>`;
  }


  // ---- try it live -----------------------------------------------------
  const EGS = [
    ["encode/httpx", 3022, "SSL config, 112 comments"],
    ["django/django", 18056, "composite primary keys"],
    ["pydantic/pydantic", 6563, "attribute docstrings"],
    ["encode/httpx", 276, "trio backend"]
  ];
  let runState = { busy:false, lines:[], result:null, error:null, target:"" };

  function tryView(){
    const r = runState;
    const log = r.lines.length ? `<div class="runlog">` + r.lines.map(l =>
        `<div><span class="st">${esc(l.stage)}</span><span class="${l.tone||''}">${esc(l.text)}</span></div>`
      ).join('') + `</div>` : '';
    const err = r.error ? `<div class="banner">${esc(r.error)}</div>` : '';
    const res = r.result ? liveResults(r.result) : '';
    return `
      <h1>Try it live</h1>
      <p class="sub">Paste a whole repository and it finds the discussions worth reading, or a single
      pull request to watch one go through. It calls the GitHub API from your browser
      and runs the real pipeline, right here.</p>

      <div class="tryform">
        <input id="tgt" value="${esc(r.target || 'https://github.com/encode/httpx/pull/3022')}"
          placeholder="https://github.com/owner/repo  or  .../pull/123"
          aria-label="Pull request URL" ${r.busy?'disabled':''}>
        <button id="go" ${r.busy?'disabled':''}>${r.busy ? 'Running…' : 'Run'}</button>
      </div>
      <div class="egs"><span class="lb">or try</span>${EGS.map(([rp,n,d])=>
        `<button data-eg="${rp}|${n}" title="${esc(d)}">${esc(rp)}#${n}</button>`).join('')}</div>

      <details class="tok"><summary>Hitting the rate limit? Add a GitHub token</summary>
        <input id="tok" type="password" placeholder="ghp_… (optional)"
          aria-label="GitHub token" autocomplete="off">
        <p>Unauthenticated GitHub allows 60 requests an hour and one run uses four. A
        read-only token raises that to 5,000. It stays in this browser tab and is sent
        to github.com and nowhere else. <b>This page has no server.</b></p>
      </details>

      ${err}${log}${res}

      <div class="realnote">
        <b>What is real here.</b> Fetching, linking and filtering are the production logic,
        running against live GitHub, and they reproduce the Python pipeline's numbers
        exactly.<br><br>
        <b>The last step is not, and it cannot be.</b> Telling a decision apart from a
        nitpick needs judgement, and regular expressions have none. What the rules do is
        spot the language a decision leaves behind: something weighed against something
        else, something measured, a condition set for changing the answer. That points at
        <em>where</em> a decision probably is. <b>Turning it into a record of what was
        actually decided is the model's job, and this page has no model.</b><br><br>
        So these are labelled candidates. In the shipped product a small fine-tuned model
        reads each one and returns the choice, the reason and what was ruled out, or
        returns nothing at all, which is the correct answer for most threads.
      </div>`;
  }

  function liveResults(out){
    if(out.repoScan) return repoResults(out.repoScan);
    const { doc, decisions } = out;
    if(!decisions.length){
      return `<div class="empty">
        <h3>Nothing in this discussion decided anything</h3>
        <p>Every comment here is a correction, a rename or a question about
        style. <b>That is what most review threads are</b>, and reporting it
        honestly is the point: how often a discussion contains a real decision
        is the first thing the research measures.</p></div>`;
    }
    return `<h2>Candidates in ${esc(doc.repo)}${doc.number?' #'+doc.number:''}</h2>` +
      `<div class="list">` + decisions.map(d => `
        <div class="row" style="cursor:default" aria-expanded="true">
          <span><span class="t">${esc(d.quote.slice(0,110))}${d.quote.length>110?'…':''}</span>
          <span class="m">${esc(d.anchor || d.governs[0] || 'not anchored')} &middot; ${esc(d.author)}</span></span>
          <span class="tags">${d.signals.map(sg =>
            `<span class="pill ${sg==='measured'?'adopted':sg.startsWith('set')?'temporary':'rejected'}">${esc(sg)}</span>`).join('')}</span>
        </div>
        <div class="detail">
          <h3>What was said</h3>
          <p class="quote">&ldquo;${esc(d.quote.slice(0,420))}${d.quote.length>420?'…':''}&rdquo;</p>
          <p class="src">${esc(d.author)}${d.anchor?' &middot; '+esc(d.anchor):''} &middot; pull request #${d.pr}</p>
          ${d.revisit?`<h3>Condition it set</h3><div class="revisit">${esc(d.revisit)}</div>`:''}
          <h3>Why this was flagged</h3>
          <p class="because" style="color:var(--muted);font-size:13.5px">
            ${d.signals.map(esc).join(' &middot; ')}. <b>A model would turn this into a
            decision record</b> with the choice, the rationale and what was ruled out.
            The rules here can only point at where one probably is.</p>
        </div>`).join('') + `</div>`;
  }

  function repoResults(r){
    if(!r.total) return `<div class="empty">
      <h3>No pull requests in ${esc(r.repo)}</h3>
      <p>Everything here was committed straight to the branch, so there is no review
      discussion to read. <b>Prior has nothing to work with in a repository like this</b>,
      and saying so is the honest answer.</p>
      <p>Try one with a review culture: <b>encode/httpx</b> or <b>django/django</b>.</p></div>`;

    const head = `<div class="repohdr">
      <div><div class="lb">Rationale density</div>
        <div style="display:flex;align-items:flex-end;gap:10px">
          <span class="sc" style="color:${r.score>=4?'var(--adopted)':'var(--rejected)'}">${r.score}</span>
          <span class="of">/ 10</span></div></div>
      <div class="nums">
        <div><b>${r.total}</b> pull requests</div>
        <div><b>${r.discussed}</b> with a real discussion
          (${Math.round(r.discussed/r.total*100)}%)</div>
        <div><b>${r.decisions.length}</b> candidates found in the top ${r.runs.length}</div>
      </div></div>`;

    if(!r.discussed) return head + `<div class="empty">
      <h3>${r.total} pull requests, and not one carries a discussion</h3>
      <p>Changes here were merged without anyone writing down why. The reasoning was
      either never recorded, or it lives somewhere this tool cannot see.</p>
      <p><b>This is the common case, and it is the first thing the research measures.</b>
      How often reasoning survives at all is a number nobody has published, and a
      repository like this one is a data point rather than a failure.</p>
      <p>Prior cannot help a project until its reviews carry reasons. Telling a team that
      plainly is more useful than pretending otherwise.</p></div>`;

    const perPr = `<h2>What each discussion gave up</h2><div class="card">` +
      r.runs.map(x => `<div class="covrow" style="grid-template-columns:62px 1fr 150px">
        <span class="a">#${x.number}</span>
        <span style="font-size:13.5px">${esc(x.title)}</span>
        <span class="n">${x.comments} comments &rarr; ${x.found} candidate${x.found===1?'':'s'}</span>
      </div>`).join('') + `</div>`;

    return head + perPr + `<h2>Candidates</h2>` +
      liveResults({ doc:{repo:r.repo, number:'' }, decisions:r.decisions })
        .replace(/^<h2>[^<]*<\/h2>/, '');
  }

  async function doRun(target){
    const t = window.PriorLive.parseTarget(target);
    if(!t){ runState.error = "I could not read that. Paste a repository, like https://github.com/encode/httpx, or a single pull request.";
            runState.result = null; runState.lines = []; return render(); }
    const tokEl = document.getElementById('tok');
    const token = tokEl ? tokEl.value : "";
    runState = { busy:true, lines:[{stage:"starting", text: t.number ? `${t.repo} #${t.number}` : t.repo, tone:"run"}],
                 result:null, error:null, target };
    render();
    const log = (stage, text, tone) => { runState.lines.push({stage, text, tone}); render(); };
    try{
      runState.result = t.number
        ? await window.PriorLive.run(t.repo, t.number, token, log)
        : { repoScan: await window.PriorLive.runRepo(t.repo, token, log) };
      runState.busy = false; render();
    }catch(err){
      runState.busy = false; runState.error = err.message; render();
    }
  }

  function overview(){
    const pct = Math.round(D.stats.withReason / D.stats.decisions * 100);
    return `
      <h1>Overview</h1>
      <p class="sub">What this repository has recorded about its own decisions.</p>
      <div class="grid g2">
        <div class="card">
          <h2 style="margin-top:0">Rationale density</h2>
          <div class="score"><span class="v">${D.score}</span><span class="o">/ 10</span></div>
          <div style="color:var(--ember)">${sparkline(D.scoreTrend)}</div>
          <p class="note" style="margin-top:4px">Seven quarters. The number is how much of
          this project's reasoning was written down at the time, not how good the code is.</p>
        </div>
        <div class="card">
          <h2 style="margin-top:0">From the history</h2>
          <div class="grid g2" style="gap:16px">
            <div class="stat"><div class="k">Pull requests</div><div class="v">${D.stats.prs}</div></div>
            <div class="stat"><div class="k">Comments</div><div class="v">${D.stats.comments.toLocaleString()}</div>
              <div class="h">${D.stats.kept.toLocaleString()} survived the filter</div></div>
            <div class="stat"><div class="k">Decisions</div><div class="v">${D.stats.decisions}</div></div>
            <div class="stat"><div class="k">With a reason</div><div class="v">${pct}%</div>
              <div class="h">the rest record what, not why</div></div>
          </div>
        </div>
      </div>

      <h2>Needs attention</h2>
      ${D.alerts.map(a=>alertRow(a)).join('')}

      <h2>Recently recorded</h2>
      ${decisionList(D.decisions.slice(0,3))}`;
  }

  function alertRow(a){
    const ic = { revisit:'!', stale:'~', gap:'?' }[a.kind];
    return `<div class="alert ${a.kind}">
      <span class="ic" aria-hidden="true">${ic}</span>
      <span><span class="tx">${esc(a.text)}</span>
      ${a.ref?`<span class="rf">${esc(a.ref)}</span>`:''}</span></div>`;
  }

  function decisions(){
    const F = [['all','All'],['adopted','Adopted'],['rejected','Ruled out'],
               ['temporary','Temporary'],['superseded','Superseded']];
    const items = filter==='all' ? D.decisions : D.decisions.filter(d=>d.status===filter);
    return `
      <h1>Decisions</h1>
      <p class="sub">Every choice this project made that someone explained at the time.</p>
      <div class="filters">${F.map(([k,l])=>
        `<button data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>
      ${items.length ? decisionList(items)
        : `<div class="card"><p style="color:var(--muted)">Nothing recorded with that status.
           Saying so is the correct answer.</p></div>`}`;
  }

  function coverage(){
    return `
      <h1>Coverage</h1>
      <p class="sub">Where the reasoning is recorded, and where it is not.</p>
      <div class="card">
        ${D.coverage.map(c=>{
          const pct = Math.round(c.covered/c.files*100);
          return `<div class="covrow">
            <span class="a">${esc(c.area)}/</span>
            <span class="bar ${c.risk==='high'?'risk':''}"><i style="width:${pct}%"></i></span>
            <span class="n">${c.covered} of ${c.files}</span></div>`;
        }).join('')}
      </div>
      <p class="note"><strong>billing</strong> and <strong>auth</strong> are the two to worry
      about: the most files, the least recorded reasoning, and in one of them the only person
      who touched it has left.</p>`;
  }

  function people(){
    return `
      <h1>People</h1>
      <p class="sub">Where knowledge sits, so you can tell when it is about to leave.</p>
      <div class="card">
        ${D.people.map(p=>`<div class="person">
          <span><span class="nm">${esc(p.name)}</span>${p.left?' <span class="pill superseded">Left</span>':''}
            <div class="ar">${p.areas.join(' &middot; ')}</div></span>
          <span class="n" style="color:var(--muted);font-size:12.5px">${p.decisions} decisions</span>
        </div>`).join('')}
      </div>
      <p class="note"><strong>This page is team level on purpose.</strong> It shows where
      knowledge is concentrated, never how much any one person knows. The moment it reads as a
      performance review, people stop writing reasons in reviews, and the whole system starves.</p>`;
  }

  function alerts(){
    return `
      <h1>Alerts</h1>
      <p class="sub">Conditions a past decision set, that have now been met.</p>
      ${D.alerts.map(a=>alertRow(a)).join('')}
      <p class="note">Each of these came from a sentence someone wrote once, in a review, and
      would otherwise never have been checked again.</p>`;
  }

  function render(){
    [...nav.querySelectorAll('button')].forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.v === view)));
    const typed = document.getElementById('tgt');
    if(typed && view === 'try' && !runState.busy) runState.target = typed.value;
    main.innerHTML = ({tour, try:tryView, overview, decisions, coverage, people, alerts})[view]();
    main.scrollTop = 0;
  }

  main.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.id === 'tgt'){ e.preventDefault(); doRun(e.target.value); }
  });
  main.addEventListener('click', e => {
    const sb = e.target.closest('[data-s]');
    if(sb){ step = +sb.dataset.s; return render(); }
    const nb = e.target.closest('[data-step]');
    if(nb){ step += nb.dataset.step === 'next' ? 1 : -1;
            step = Math.max(0, Math.min(T.length-1, step)); return render(); }
    const eg = e.target.closest('[data-eg]');
    if(eg){ const [rp,n] = eg.dataset.eg.split('|');
            return doRun(`https://github.com/${rp}/pull/${n}`); }
    if(e.target.id === 'go'){
      return doRun(document.getElementById('tgt').value); }
    const f = e.target.closest('[data-f]');
    if(f){ filter = f.dataset.f; open = null; return render(); }
    const r = e.target.closest('.row');
    if(r){ open = open === r.dataset.id ? null : r.dataset.id; return render(); }
  });

  render();
})();
</script>
</body>
</html>
